name: Release cargo-cleaner

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cargo-cleaner-release
  cancel-in-progress: false

env:
  RUST_VERSION: "1.95.0"
  CARGO_TERM_COLOR: always

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Choose the release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$(python3 - <<'PY'
          import re
          import subprocess
          import tomllib

          def versions(*args):
              tags = subprocess.check_output(["git", "tag", *args], text=True).splitlines()
              return sorted(tuple(map(int, tag[1:].split("."))) for tag in tags
                            if re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag))

          current = versions("--points-at", "HEAD")
          if current:
              version = current[-1]
          else:
              with open("Cargo.toml", "rb") as manifest:
                  base = tuple(map(int, tomllib.load(manifest)["workspace"]["package"]["version"].split(".")))
              existing = versions()
              if existing and existing[-1] >= base:
                  major, minor, patch = existing[-1]
                  version = major, minor, patch + 1
              else:
                  version = base
          print("v" + ".".join(map(str, version)))
          PY
          )"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          published="$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          if [[ "$published" == false ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      TARGET: ${{ matrix.target }}
      TAG: ${{ needs.version.outputs.tag }}
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal

      - name: Cache Cargo downloads and build dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            target/release
          key: cargo-release-${{ matrix.runner }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}

      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail
          test "$(rustc +"$RUST_VERSION" -vV | sed -n 's/^host: //p')" = "$TARGET"
          export CARGO_CLEANER_VERSION="${TAG#v}"
          cargo +"$RUST_VERSION" build --locked --release --package cargo-cleaner
          if [[ "$TARGET" == x86_64-unknown-linux-gnu ]]; then
            cargo +"$RUST_VERSION" test --locked --release --workspace
          fi
          binary=target/release/cargo-cleaner
          test "$("$binary" --version)" = "cargo-cleaner $CARGO_CLEANER_VERSION"
          mkdir -p package/completions
          cp "$binary" LICENSE package/
          "$binary" complete --shell bash > package/completions/cargo-cleaner.bash
          "$binary" complete --shell zsh > package/completions/_cargo-cleaner
          "$binary" complete --shell fish > package/completions/cargo-cleaner.fish
          tar -C package -czf "cargo-cleaner-$TAG-$TARGET.tar.gz" .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cargo-cleaner-${{ matrix.target }}
          path: cargo-cleaner-*.tar.gz
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: cargo-cleaner-*
          path: dist
          merge-multiple: true

      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          # A separate tag reserves the version if publishing needs to be retried.
          tag_sha="$(gh api "repos/$GH_REPO/commits/$TAG" --jq '.sha' 2>/dev/null || true)"
          if [[ -z "$tag_sha" ]]; then
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" >/dev/null
          else
            test "$tag_sha" = "$GITHUB_SHA"
          fi
          draft="$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          case "$draft" in
            true)
              gh release upload "$TAG" dist/*.tar.gz --clobber
              gh release edit "$TAG" --draft=false
              ;;
            false) ;;
            *) gh release create "$TAG" dist/*.tar.gz --verify-tag --generate-notes ;;
          esac
